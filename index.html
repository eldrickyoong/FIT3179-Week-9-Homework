<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Vega-Lite</title>
<style>body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;padding:24px}#vis{max-width:1000px;margin:0 auto}</style>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head><body>
<div id="vis"></div>
<script>
const spec = {"$schema": "https://vega.github.io/schema/vega-lite/v5.json", "width": 1000, "height": 300, "title": "Population Density (people/km\u00b2) of Malaysia by State (2025)", "projection": {"type": "mercator"}, "data": {"url": "../data/gadm41_MYS_1.topojson", "format": {"type": "topojson", "feature": "gadm41_MYS_1"}}, "transform": [{"lookup": "properties.NAME_1", "from": {"data": {"url": "../data/population_state_pop_dens.csv"}, "key": "state", "fields": ["pop_dens", "population", "area_size"]}}], "mark": {"type": "geoshape", "stroke": "grey"}, "encoding": {"color": {"title": "People per km\u00b2", "field": "pop_dens", "type": "quantitative", "scale": {"type": "log", "scheme": {"name": "lighttealblue"}}}, "tooltip": [{"field": "properties.NAME_1", "type": "nominal", "title": "State"}, {"field": "pop_dens", "type": "quantitative", "title": "People per km\u00b2", "format": ",d"}, {"field": "population", "type": "quantitative", "title": "Population", "format": ",d"}, {"field": "area_size", "type": "quantitative", "title": "Area Size (km\u00b2)", "format": ",d"}]}};
vegaEmbed("#vis", spec, { actions: { export:true, source:true, editor:true } });
</script>
</body></html>
